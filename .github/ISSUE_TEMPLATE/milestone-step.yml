name: Milestone step
description: One reviewable step of a milestone, with criteria an assistant can verify.
title: "M?: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What exists when this step is done, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A checklist. Each item must be checkable with a command or by reading a file.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof command
      description: The command whose output shows the step is done.
      placeholder: just verify
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this step must not touch.
