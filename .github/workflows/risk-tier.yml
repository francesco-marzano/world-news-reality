name: risk-tier

# Labels every pull request with its risk level (see AGENTS.md).
# pull_request_target runs the workflow and the classifier from the base branch: the code of
# the pull request is never checked out or executed here, so it cannot change its own level.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const path = require("node:path");
            const modulePath = path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/risk-tier.mjs");
            const { classify, RISK_LABELS } = await import(pathToFileURL(modulePath).href);

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });
            const result = classify(files);

            const current = context.payload.pull_request.labels.map((label) => label.name);
            for (const stale of current.filter((n) => RISK_LABELS.includes(n) && n !== result.label)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: stale });
            }
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: number,
              labels: [result.label],
            });

            core.summary.addHeading(`Risk level ${result.level}`, 2);
            if (result.reasons.length > 0) core.summary.addList(result.reasons);
            await core.summary.write();
