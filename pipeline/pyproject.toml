[project]
name = "world-news-reality"
version = "0.1.0"
description = "Pipeline that measures which world news stories Italian media leave out."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Francesco Marzano" }]
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.15,<1",
]

[project.scripts]
wnr = "world_news_reality.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.120",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-socket>=0.7",
  "ruff>=0.8",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_news_reality"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "PTH", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --disable-socket"
xfail_strict = true
filterwarnings = ["error"]
